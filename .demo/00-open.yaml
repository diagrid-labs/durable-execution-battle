title: 00 — Opening
description: |
  Opening section: title → disclosure → what is durable execution →
  the 5 contenders → audience familiarity poll (EngageTime) →
  lineage map → dimensions preview.

  DemoTime drives the EngageTime poll start/stop so only one extension
  is operated on stage.
version: 3
engageTime:
  sessionId: sxn6sb
scenes:
  - id: open-title
    title: Title
    moves:
      - action: setPresentationView
      - action: openSlide
        path: slides/00-open/00-title.md
      - action: startEngageTimeSession
      - action: closeEngageTimePoll
        disabled: false
        pollId: xumlr9
      - action: closeEngageTimePoll
        disabled: false
        pollId: 9ecd8r
  - id: demo-mpvgo1ji-7rhz
    title: Start timer
    moves:
      - action: executeVSCodeCommand
        command: demo-time.startCountdown
  - id: open-bio
    title: Bio
    moves:
      - action: openSlide
        path: slides/00-open/01-bio.md
  - id: open-why-durable-execution
    title: Why durable execution matters now
    moves:
      - action: openSlide
        path: slides/00-open/00b-why-durable-execution.md
  - id: open-agenda
    title: Agenda
    moves:
      - action: openSlide
        path: slides/00-open/02-agenda.md
  - id: open-what-is
    title: What is durable execution?
    moves:
      - action: openSlide
        path: slides/00-open/02-what-is-durable-execution.md
  - id: open-process-order
    title: How process_order stays durable (state writes/reads)
    moves:
      - action: markdownPreview
        path: slides/00-open/03-process-order.md
  - id: open-poll-qr
    title: Show the QR slide and start the opening poll
    moves:
      - action: showEngageTimePoll
        startOnOpen: true
        pollId: 9ecd8r
  - id: open-five-contenders
    title: The 5 contenders (poll question matches the option list)
    moves:
      - action: openSlide
        path: slides/00-open/04-five-contenders.md
  - id: open-lineage-map
    title: Lineage map
    moves:
      - action: markdownPreview
        path: slides/00-open/05-lineage-map.md
  - id: open-dimensions-preview
    title: Dimensions preview
    moves:
      - action: openSlide
        path: slides/00-open/06-dimensions-preview.md
      - action: closeEngageTimePoll
        pollId: 9ecd8r
